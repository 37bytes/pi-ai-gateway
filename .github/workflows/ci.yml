name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Проверка транспорта на OMP 19.2.0
        run: |
          host="$RUNNER_TEMP/omp-19.2"
          npm install --prefix "$host" --no-audit --no-fund @oh-my-pi/pi-coding-agent@19.2.0
          printf '#!/usr/bin/env bash\nexec bun "%s/node_modules/@oh-my-pi/pi-coding-agent/dist/cli.js" "$@"\n' "$host" > "$host/omp"
          chmod +x "$host/omp"
          OMP_FIXTURE_BINARY="$host/omp" npm run check:installed-host
